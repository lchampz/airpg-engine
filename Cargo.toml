[package]
name = "airpg-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "0.8", features = ["uuid1", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }
async-nats = "0.35"
futures = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.8"
fastembed = "5"
# ort-sys só está publicado no crates.io na rc.13 (confirmado — não existe
# rc.4 de ort-sys, só de `ort`), então qualquer `ort` mais antigo que rc.13
# ainda acaba puxando ort-sys=rc.13 no fim, cujo build script exige uma
# feature de TLS explícita. Solução: usar fastembed 5.x (API compatível
# com ort rc.13) e fixar `ort` na rc.13 com a feature de TLS habilitada
# diretamente, em vez de tentar forçar uma versão antiga de ort (ver
# Coordenacao-Entre-Sessoes.md pro histórico de tentativas que falharam).
ort = { version = "=2.0.0-rc.13", features = ["download-binaries", "tls-rustls"] }
clap = { version = "4", features = ["derive"] }
